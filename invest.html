<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investing and Compound Growth · C4FE</title>
<meta name="description" content="See how regular investing grows, why starting early matters, and what fees cost. A teaching tool from UTEP's Center for Free Enterprise.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header id="site-header"></header>

<main class="wrap">
  <div id="site-notice"></div>

  <div class="bench" style="margin-top:22px">
    <form class="panel" id="form" autocomplete="off">
      <h2 data-i18n="inputs_h"></h2>
      <p class="sub" data-i18n="example_note"></p>
      <div class="fields" id="fields"></div>
    </form>

    <div class="results">
      <section class="panel" aria-live="polite">
        <p class="sub" style="margin:0 0 6px" id="big-label"></p>
        <div class="big" id="big"></div>
        <p style="margin:10px 0 0" id="range"></p>
        <div class="stats" id="stats"></div>
      </section>

      <div class="msgs" id="msgs"></div>

      <section class="panel">
        <h3 data-i18n="chart_h"></h3>
        <div class="legend"><span><i style="background:var(--band-fill);border:1px solid var(--interest)"></i><span data-i18n="leg_band"></span></span><span><i style="background:var(--interest)"></i><span data-i18n="leg_mid"></span></span><span><i style="background:transparent;border-top:2px dashed var(--muted);height:0;border-radius:0;vertical-align:3px"></i><span data-i18n="leg_in"></span></span></div>
        <div class="chartbox" id="chart"></div>
        <p class="assume" data-i18n="assume"></p>
      </section>

      <section class="panel">
        <h3 data-i18n="cmp_h"></h3>
        <p class="sub" data-i18n="cmp_sub"></p>
        <div class="compare" id="compare"></div>
      </section>

      <section class="panel takeaway">
        <h3 data-i18n="take_h"></h3>
        <p data-i18n="take"></p>
        <p class="read" data-i18n="read"></p>
      </section>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="assets/js/site.js"></script>
<script src="assets/js/invest.js"></script>
</body>
</html>
