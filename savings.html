<body>
<header id="site-header"></header>

<main class="wrap">
  <div id="site-notice"></div>

  <div class="tabs" role="tablist" aria-label="Goal">
    <button class="tab" role="tab" data-type="car" aria-selected="true" data-i18n="tab_car">A car</button>
    <button class="tab" role="tab" data-type="home" aria-selected="false" data-i18n="tab_home">Home down payment</button>
    <button class="tab" role="tab" data-type="custom" aria-selected="false" data-i18n="tab_custom">Your own goal</button>
  </div>

  <div class="bench">
    <form class="panel" id="form" autocomplete="off">
      <h2 data-i18n="inputs_h"></h2>
      <p class="sub" data-i18n="example_note"></p>
      <div class="seg" id="mode" role="radiogroup"></div>
      <div class="fields" id="fields"></div>
    </form>

    <div class="results">
      <section class="panel" aria-live="polite">
        <p class="sub" style="margin:0 0 6px" id="big-label"></p>
        <div class="big" id="big"></div>
        <div class="stats" id="stats"></div>
      </section>

      <div class="msgs" id="msgs"></div>

      <section class="panel">
        <h3 data-i18n="chart_h"></h3>
        <div class="legend"><span><i style="background:var(--principal)"></i><span data-i18n="leg_in"></span></span><span><i style="background:var(--interest)"></i><span data-i18n="leg_int"></span></span><span><i style="background:transparent;border:2px dashed var(--ink);width:14px;height:0;border-radius:0;vertical-align:3px"></i><span data-i18n="leg_goal"></span></span></div>
        <div class="chartbox" id="chart"></div>
      </section>

      <section class="panel takeaway">
        <h3 data-i18n="take_h"></h3>
        <p data-i18n="take"></p>
        <p class="read"><a href="session-1.html#section-3-saving-with-purpose" data-i18n="read"></a></p>
      </section>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
