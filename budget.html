<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Simulator · C4FE</title>
<meta name="description" content="Turn a salary into take-home pay and build a monthly budget. A teaching tool from UTEP's Center for Free Enterprise.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header id="site-header"></header>

<main class="wrap">
  <div id="site-notice"></div>

  <div class="bench" style="margin-top:22px">
    <form class="panel" id="form" autocomplete="off">
      <h2 data-i18n="inputs_h"></h2>
      <p class="sub" data-i18n="example_note"></p>
      <div class="fields" id="fields"></div>
    </form>

    <div class="results">
      <section class="panel" aria-live="polite">
        <h3 data-i18n="paycheck_h"></h3>
        <p class="sub" style="margin:10px 0 6px" data-i18n="takehome"></p>
        <div class="big" id="net"></div>
        <dl class="stub" id="stub"></dl>
        <p class="assume" id="taxnote"></p>
      </section>

      <div class="msgs" id="msgs" aria-live="polite"></div>

      <section class="panel">
        <h3 data-i18n="split_h"></h3>
        <p class="sub" data-i18n="split_sub"></p>
        <div class="split" id="split"></div>
      </section>

      <section class="panel">
        <h3 data-i18n="ef_h"></h3>
        <div class="stats" id="ef"></div>
      </section>

      <section class="panel takeaway">
        <h3 data-i18n="take_h"></h3>
        <p data-i18n="take"></p>
        <p class="read" data-i18n="read"></p>
      </section>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="assets/js/site.js"></script>
<script src="assets/js/budget.js"></script>
</body>
</html>
