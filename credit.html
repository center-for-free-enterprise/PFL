<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit Cards · C4FE</title>
<meta name="description" content="See what paying only the minimum on a credit card really costs. A teaching tool from UTEP's Center for Free Enterprise.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C4FE Personal Financial Literacy Tools">
<meta property="og:title" content="Credit Cards · C4FE">
<meta property="og:description" content="See what paying only the minimum on a credit card really costs. A teaching tool from UTEP's Center for Free Enterprise.">
<meta property="og:url" content="https://center-for-free-enterprise.github.io/PFL/credit.html">
<meta property="og:image" content="https://center-for-free-enterprise.github.io/PFL/assets/img/social-preview.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="UTEP Center for Free Enterprise: Personal Financial Literacy interactive calculators, in English and Spanish">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header id="site-header"></header>

<main class="wrap">
  <div id="site-notice"></div>

  <div class="bench" style="margin-top:22px">
    <form class="panel" id="form" autocomplete="off">
      <h2 data-i18n="inputs_h"></h2>
      <p class="sub" data-i18n="example_note"></p>
      <div class="fields" id="fields"></div>
    </form>

    <div class="results">
      <section class="panel" aria-live="polite">
        <p class="sub" style="margin:0 0 6px" data-i18n="big_label"></p>
        <div class="big" id="big"></div>
        <p style="margin:10px 0 0" id="big-sub"></p>
        <p class="sub" id="first"></p>
        <div class="cardact">
          <div class="warn"><b data-i18n="ca_warn_h"></b> <span data-i18n="ca_warn"></span></div>
          <table id="cardact"></table>
        </div>
        <p class="tila-cap" data-i18n="ca_cap"></p>
      </section>

      <div class="msgs" id="msgs"></div>

      <section class="panel">
        <h3 data-i18n="chart_h"></h3>
        <div class="legend"><span><i style="background:transparent;border-top:2px dashed var(--muted);height:0;border-radius:0;vertical-align:3px"></i><span data-i18n="leg_min"></span></span><span><i style="background:var(--interest)"></i><span data-i18n="leg_yours"></span></span><span><i style="background:var(--principal)"></i><span data-i18n="leg_36"></span></span></div>
        <div class="chartbox" id="chart"></div>
        <p class="assume" data-i18n="assume"></p>
      </section>

      <section class="panel takeaway">
        <h3 data-i18n="take_h"></h3>
        <p data-i18n="take"></p>
        <p class="read" data-i18n="read"></p>
      </section>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="assets/js/site.js"></script>
<script src="assets/js/credit.js"></script>
</body>
</html>
